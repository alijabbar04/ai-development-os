<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Development OS — Local planning workspace</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#workspace-main">Skip to workspace</a>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="AI Development OS">
          <span class="brand-mark" aria-hidden="true"></span>
          <span><strong>AI Development OS</strong><small>Local planning workspace</small></span>
        </div>
        <div class="topbar-state">
          <span id="service-pill" class="status-pill" data-status="loading">Starting workspace</span>
          <span id="mode-pill" class="mode-pill">Normal</span>
        </div>
      </header>
      <div class="body-grid">
        <nav class="sidebar" aria-label="Workspace">
          <button type="button" data-route="home" aria-current="page">Home</button>
          <button type="button" data-route="project">Project brief</button>
          <button type="button" data-route="ai-planning">AI planning</button>
          <button type="button" data-route="plan">Plan</button>
          <button type="button" data-route="approvals">Approvals</button>
          <button type="button" data-route="handovers">Handovers</button>
          <button type="button" data-route="settings">Settings</button>
        </nav>
        <main id="workspace-main" tabindex="-1"></main>
      </div>
    </div>
    <div id="status-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <p id="planning-fixture-banner" class="planning-fixture-banner" hidden>Owned synthetic AI fixture · no live provider call</p>
    <dialog id="detail-dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title">Details</h2>
        <button type="button" id="dialog-close" aria-label="Close details">×</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="./entry.js"></script>
  </body>
</html>
